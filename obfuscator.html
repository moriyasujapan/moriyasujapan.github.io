<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Obfuscator</title>
    <script src="https://cdn.jsdelivr.net/npm/javascript-obfuscator/dist/index.browser.js"></script>
    <script>
        function obfuscate(scr) {
            // var JavaScriptObfuscator = require('javascript-obfuscator');
            const obfuscatorOptions = {
                compact: true,
                controlFlowFlattening: true,
                controlFlowFlatteningThreshold: 1,
                deadCodeInjection: true,
                deadCodeInjectionThreshold: 1,
                // debugProtection: true,
                // debugProtectionInterval: true,
                // disableConsoleOutput: true,
                identifierNamesGenerator: 'mangled', // or 'hexadecimal'
                identifiersPrefix: '',
                inputFileName: '',
                log: false,
                numbersToExpressions: true,
                renameGlobals: true,
                selfDefending: true,
                simplify: true,
                splitStrings: true,
                splitStringsChunkLength: 10,
                stringArray: true,
                stringArrayCallsTransform: true,
                stringArrayCallsTransformThreshold: 1,
                stringArrayEncoding: ['base64', 'rc4'],
                stringArrayIndexShift: true,
                stringArrayRotate: true,
                stringArrayShuffle: true,
                stringArrayWrappersCount: 5,
                stringArrayWrappersChainedCalls: true,
                stringArrayWrappersType: 'function',
                stringArrayThreshold: 1,
                transformObjectKeys: true,
                unicodeEscapeSequence: true
            };

            var obfuscationResult = JavaScriptObfuscator.obfuscate(scr, obfuscatorOptions);
            return obfuscationResult.getObfuscatedCode();      
        }
        function gen() {
            console.log(document.getElementById('srcText').value);
            console.log(obfuscate(document.getElementById('srcText').value));
            document.getElementById('destText').value = obfuscate(document.getElementById('srcText').value);
        }
    </script>
</head>
<body>
    <pre>
        <textarea id="srcText"></textarea>
        <textarea id="destText"></textarea>
        <button onclick="gen();">obfuscate</button>
    </pre>
</body>
</html>
