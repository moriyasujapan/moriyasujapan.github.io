<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>17VIP Bookmarklet</title>
    <script src="https://cdn.jsdelivr.net/npm/javascript-obfuscator/dist/index.browser.js"></script>
    <script>
        var JavaScriptObfuscator = require('javascript-obfuscator');

        function obfuscate(scr) {
            const obfuscatorOptions = {
                compact: true,
                controlFlowFlattening: true,
                controlFlowFlatteningThreshold: 1,
                deadCodeInjection: true,
                deadCodeInjectionThreshold: 1,
                debugProtection: true,
                debugProtectionInterval: true,
                disableConsoleOutput: true,
                identifierNamesGenerator: 'mangled', // or 'hexadecimal'
                identifiersPrefix: '',
                inputFileName: '',
                log: false,
                numbersToExpressions: true,
                renameGlobals: true,
                selfDefending: true,
                simplify: true,
                splitStrings: true,
                splitStringsChunkLength: 10,
                stringArray: true,
                stringArrayCallsTransform: true,
                stringArrayCallsTransformThreshold: 1,
                stringArrayEncoding: ['base64', 'rc4'],
                stringArrayIndexShift: true,
                stringArrayRotate: true,
                stringArrayShuffle: true,
                stringArrayWrappersCount: 5,
                stringArrayWrappersChainedCalls: true,
                stringArrayWrappersType: 'function',
                stringArrayThreshold: 1,
                transformObjectKeys: true,
                unicodeEscapeSequence: true
            };

            var obfuscationResult = JavaScriptObfuscator.obfuscate(scr, obfuscatorOptions);
            return obfuscationResult.getObfuscatedCode();      
        }

        function gen() {
            let email = document.getElementById("email").value;
            let tel = document.getElementById("tel").value;
            let script = "javascript:";
            script += 'document.getElementById("cc_mailAddress").value = "' + email + '";';
            script += 'document.getElementById("cc_mailAddressConfirm").value = "' + email + '";';
            script += 'document.getElementById("cc_telno").value = "' + tel + '";';

            script = obfuscate(script);

            document.getElementById("scr").innerHTML = script;
            document.getElementById("result").style.display = "block";
            selectAll();
        }
        function selectAll() {
            document.getElementById("scr").select();
        }
    </script>
</head>

<body>
    <pre>
        <input type="email" id="email" placeholder="example@17.live">
        <input type="tel" id="tel" placeholder="09012345678">
        <button onclick="gen();">Generate</button>
        <div id="result" style="display: none;">
            <textarea id="scr" id="scr" style="width: 90%; height: 200px;"></textarea>
            <button onclick="selectAll();">SelectAll</button>
        </div>
    </pre>

</body>

</html>
